```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Counting the Moments</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #08090d;
    --card: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.09);
    --text: #f5f5f7;
    --muted: #8f939f;
    --accent: #ff6b8a;
    --accent2: #a78bfa;
    --glow: rgba(255,107,138,0.16);
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(167,139,250,0.09),
            transparent 32%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(255,107,138,0.08),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    min-height: 100svh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        max(22px, env(safe-area-inset-top))
        18px
        max(22px, env(safe-area-inset-bottom));

    overflow: hidden;

    position: relative;
}

/* --------------------------------
   BACKGROUND ATMOSPHERE
-------------------------------- */

.background-glow {
    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 500px;
    max-height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            var(--glow),
            transparent 70%
        );

    filter: blur(35px);

    animation: breathe 8s ease-in-out infinite;

    pointer-events: none;
}

@keyframes breathe {
    0%,100% {
        transform: scale(0.95);
        opacity: .55;
    }

    50% {
        transform: scale(1.08);
        opacity: .9;
    }
}

/* Small floating particles */

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,255,255,.35);

    animation:
        particleFloat
        linear infinite;

    pointer-events: none;
}

@keyframes particleFloat {

    0% {
        transform:
            translateY(110vh)
            translateX(0)
            scale(.5);

        opacity: 0;
    }

    15% {
        opacity: .5;
    }

    85% {
        opacity: .5;
    }

    100% {
        transform:
            translateY(-10vh)
            translateX(60px)
            scale(1);

        opacity: 0;
    }
}

/* --------------------------------
   MAIN
-------------------------------- */

.container {

    width: 100%;
    max-width: 540px;

    text-align: center;

    position: relative;

    z-index: 2;
}

/* --------------------------------
   TOP LABEL
-------------------------------- */

.eyebrow {

    display: inline-flex;

    align-items: center;
    gap: 8px;

    padding: 7px 13px;

    border: 1px solid var(--border);

    background: rgba(255,255,255,.035);

    border-radius: 999px;

    color: #b5b8c2;

    font-size: 10px;

    font-weight: 600;

    letter-spacing: 2.2px;

    text-transform: uppercase;

    margin-bottom: 22px;

    backdrop-filter: blur(12px);
}

.eyebrow-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--accent);

    box-shadow:
        0 0 10px var(--accent);

    animation: dotPulse 2s infinite;
}

@keyframes dotPulse {

    0%,100% {
        opacity: .5;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* --------------------------------
   TITLE
-------------------------------- */

h1 {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(2rem, 8vw, 3.2rem);

    line-height: 1.08;

    font-weight: 400;

    letter-spacing: -1px;

    margin-bottom: 14px;

    background:
        linear-gradient(
            120deg,
            #ffffff 10%,
            #ffb4c5 50%,
            #c7b8ff 90%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;
}

.subtitle {

    max-width: 410px;

    margin: auto;

    color: var(--muted);

    font-size:
        clamp(.88rem, 3.8vw, 1rem);

    line-height: 1.6;

    font-weight: 350;
}

/* --------------------------------
   COUNTDOWN
-------------------------------- */

.countdown {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 8px;

    margin-top: 34px;
}

/* Time card */

.time-box {

    position: relative;

    padding:
        18px 6px
        15px;

    min-width: 0;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border: 1px solid var(--border);

    box-shadow:
        0 12px 35px rgba(0,0,0,.28);

    backdrop-filter: blur(16px);

    overflow: hidden;

    transition:
        transform .25s ease,
        border-color .25s ease;
}

.time-box::before {

    content: "";

    position: absolute;

    top: 0;
    left: 20%;

    width: 60%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
}

.number {

    font-size:
        clamp(1.8rem, 9vw, 3rem);

    font-weight: 400;

    line-height: 1;

    letter-spacing: -1px;

    font-variant-numeric:
        tabular-nums;

    color: #ffffff;

    margin-bottom: 8px;
}

.label {

    font-size:
        clamp(.54rem, 2.5vw, .68rem);

    letter-spacing:
        clamp(1px, .5vw, 1.8px);

    text-transform: uppercase;

    color: #777b87;

    font-weight: 600;
}

/* Tick animation */

.tick {

    animation:
        tick .35s
        cubic-bezier(.2,.8,.3,1);
}

@keyframes tick {

    0% {
        transform: translateY(4px) scale(.92);
        opacity: .35;
    }

    100% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
}

/* --------------------------------
   EXPERIMENT STATUS
-------------------------------- */

.status {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 25px;

    color: #737783;

    font-size: 10px;

    letter-spacing: 1.7px;

    text-transform: uppercase;
}

.status-line {

    width: 20px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #555967
        );
}

.status-line.right {

    background:
        linear-gradient(
            90deg,
            #555967,
            transparent
        );
}

/* --------------------------------
   THEME WORDS
-------------------------------- */

.exploration {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 0;

    margin-top: 31px;

    padding-top: 22px;

    border-top:
        1px solid
        rgba(255,255,255,.055);
}

.explore-item {

    padding:
        0 13px;

    color: #777b87;

    font-size:
        clamp(.58rem, 2.5vw, .7rem);

    letter-spacing:
        clamp(1px, .5vw, 1.8px);

    text-transform: uppercase;

    font-weight: 600;

    position: relative;
}

.explore-item:not(:last-child)::after {

    content: "·";

    position: absolute;

    right: -2px;

    color: #4d505b;
}

/* --------------------------------
   ARRIVAL MESSAGE
-------------------------------- */

#message {

    display: none;

    margin-top: 35px;

    font-family: Georgia, serif;

    font-size:
        clamp(1.5rem, 7vw, 2.3rem);

    color: #ff9fb5;

    line-height: 1.3;

    text-shadow:
        0 0 25px
        rgba(255,107,138,.3);
}

/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 380px) {

    body {
        padding-left: 12px;
        padding-right: 12px;
    }

    .countdown {
        gap: 6px;
        margin-top: 28px;
    }

    .time-box {
        padding:
            15px 3px
            13px;

        border-radius: 13px;
    }

    .number {
        font-size: 1.75rem;
    }

    .label {
        font-size: .5rem;
    }

    .explore-item {
        padding: 0 9px;
    }
}

/* --------------------------------
   VERY SMALL HEIGHT DEVICES
-------------------------------- */

@media (max-height: 650px) {

    .eyebrow {
        margin-bottom: 14px;
    }

    h1 {
        margin-bottom: 9px;
    }

    .countdown {
        margin-top: 23px;
    }

    .exploration {
        margin-top: 22px;
        padding-top: 17px;
    }
}

/* --------------------------------
   REDUCED MOTION
-------------------------------- */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div id="particles"></div>

<main class="container">

    <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        Something is unfolding
    </div>

    <h1>
        Counting the Moments
    </h1>

    <p class="subtitle">
        One moment at a time.
        No shortcuts. No spoilers.
        Just curiosity about what comes next.
    </p>


    <section
        class="countdown"
        id="countdown"
        aria-label="Countdown"
    >

        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">Days</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">Hours</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">Minutes</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">Seconds</div>
        </div>

    </section>


    <div class="status">

        <span class="status-line"></span>

        <span>Experiment in progress</span>

        <span class="status-line right"></span>

    </div>


    <div class="exploration">

        <div class="explore-item">
            Curiosity
        </div>

        <div class="explore-item">
            Adventure
        </div>

        <div class="explore-item">
            Experiment
        </div>

    </div>


    <div id="message">
        The moment has arrived. ✦
    </div>

</main>


<script>

/* =================================
   TARGET DATE
================================= */

const targetDate =
    new Date(
        "September 26, 2026 19:30:00"
    ).getTime();


/* =================================
   ELEMENTS
================================= */

const elements = {

    days:
        document.getElementById("days"),

    hours:
        document.getElementById("hours"),

    minutes:
        document.getElementById("minutes"),

    seconds:
        document.getElementById("seconds"),

    countdown:
        document.getElementById("countdown"),

    message:
        document.getElementById("message")

};


/* =================================
   PREVIOUS VALUES
================================= */

let previous = {

    days: "",
    hours: "",
    minutes: "",
    seconds: ""

};


/* =================================
   FORMAT
================================= */

function pad(value) {

    return String(value)
        .padStart(2, "0");

}


/* =================================
   UPDATE UNIT
================================= */

function updateUnit(
    key,
    value
) {

    if (previous[key] === value) {
        return;
    }

    const element =
        elements[key];

    element.textContent =
        value;

    element.classList.remove("tick");

    /* Restart animation */
    void element.offsetWidth;

    element.classList.add("tick");

    previous[key] = value;
}


/* =================================
   COUNTDOWN
================================= */

function updateCountdown() {

    const now =
        Date.now();

    const difference =
        targetDate - now;


    /* Arrival */

    if (difference <= 0) {

        clearInterval(
            countdownInterval
        );

        elements.countdown.style.display =
            "none";

        elements.message.style.display =
            "block";

        return;
    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );


    updateUnit(
        "days",
        pad(days)
    );

    updateUnit(
        "hours",
        pad(hours)
    );

    updateUnit(
        "minutes",
        pad(minutes)
    );

    updateUnit(
        "seconds",
        pad(seconds)
    );
}


/* =================================
   PARTICLES
================================= */

function createParticles() {

    const container =
        document.getElementById(
            "particles"
        );

    const amount =
        window.innerWidth < 500
            ? 14
            : 22;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";


        particle.style.left =
            Math.random() * 100 +
            "vw";


        particle.style.animationDuration =
            (10 + Math.random() * 12) +
            "s";


        particle.style.animationDelay =
            (-Math.random() * 15) +
            "s";


        particle.style.opacity =
            0.15 +
            Math.random() * 0.35;


        const size =
            2 +
            Math.random() * 2;


        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";


        container.appendChild(
            particle
        );
    }
}


/* =================================
   START
================================= */

createParticles();

updateCountdown();

const countdownInterval =
    setInterval(
        updateCountdown,
        1000
    );

</script>

</body>
</html>
