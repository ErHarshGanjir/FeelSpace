
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Counting the Moments</title>

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ================================
           BODY
        ================================= */

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #231215 0%,
                    #0f0709 100%
                );

            color: #f7fafc;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            overflow: hidden;

            position: relative;
        }


        /* ================================
           SOFT BACKGROUND GLOW
        ================================= */

        body::before {

            content: "";

            position: absolute;

            width: min(400px, 90vw);
            height: min(400px, 90vw);

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(226, 92, 114, 0.15) 0%,
                    transparent 70%
                );

            border-radius: 50%;

            filter: blur(40px);

            animation:
                pulseGlow 10s
                infinite ease-in-out;

            z-index: 0;

            pointer-events: none;
        }


        @keyframes pulseGlow {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);

                opacity: .6;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.3);

                opacity: .9;
            }
        }


        /* ================================
           PETALS
        ================================= */

        #petal-container {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .petal {

            position: absolute;

            background:
                linear-gradient(
                    135deg,
                    #e25c72,
                    #b83b5e
                );

            border-radius:
                150px 0 150px 150px;

            opacity: .3;

            pointer-events: none;

            animation:
                floatAway 12s
                infinite linear;
        }


        @keyframes floatAway {

            0% {

                transform:
                    translate3d(0, 100vh, 0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: .4;
            }

            90% {
                opacity: .4;
            }

            100% {

                transform:
                    translate3d(100px, -10vh, 0)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {

            max-width: 600px;

            width: 100%;

            text-align: center;

            position: relative;

            z-index: 1;
        }


        /* ================================
           BADGE
        ================================= */

        .intent-badge {

            display: inline-block;

            background:
                rgba(226, 92, 114, 0.08);

            border:
                1px solid
                rgba(226, 92, 114, 0.25);

            color: #f687b3;

            padding: 6px 16px;

            border-radius: 30px;

            font-size: .8rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 25px;

            font-weight: 600;
        }


        /* ================================
           HEADING
        ================================= */

        h1 {

            font-size:
                clamp(
                    1.85rem,
                    7vw,
                    2.4rem
                );

            margin-bottom: 12px;

            font-weight: 500;

            letter-spacing: -.5px;

            line-height: 1.15;

            font-family: Georgia, serif;

            background:
                linear-gradient(
                    90deg,
                    #f6ad55,
                    #f687b3
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        /* ================================
           SUBTITLE
        ================================= */

        .subtitle {

            font-size:
                clamp(
                    .92rem,
                    3.8vw,
                    1.05rem
                );

            color: #cbd5e0;

            margin-bottom: 42px;

            line-height: 1.6;

            font-weight: 300;

            padding: 0 8px;
        }


        /* ================================
           COUNTDOWN
        ================================= */

        .countdown-display {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 12px;

            margin-bottom: 38px;

            width: 100%;
        }


        /* ================================
           TIME BOX
        ================================= */

        .time-box {

            background:
                rgba(35, 20, 24, 0.4);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            border:
                1px solid
                rgba(226, 92, 114, 0.15);

            padding:
                21px 7px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.4);

            position: relative;

            min-width: 0;

            /*
               IMPORTANT:
               Keep the card completely static.
               No transform animation here.
            */
        }


        /* ================================
           NUMBER WRAPPER
        ================================= */

        .number {

            font-size:
                clamp(
                    2rem,
                    9vw,
                    3.2rem
                );

            font-weight: 400;

            color: #fff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            line-height: 1;

            margin-bottom: 8px;

            font-variant-numeric:
                tabular-nums;

            /*
               Fixed visual area prevents
               any layout jump.
            */

            min-height:
                clamp(
                    32px,
                    9vw,
                    52px
                );

            display: flex;

            align-items: center;

            justify-content: center;

            /*
               Animation happens only on
               the text itself.
            */

            will-change: opacity;
        }


        /* ================================
           SECOND CHANGE ANIMATION
        ================================= */

        .animate-tick {

            animation:
                numberTick
                .28s
                ease-out;
        }


        @keyframes numberTick {

            0% {

                opacity: .25;

                filter:
                    blur(2px);
            }

            45% {

                opacity: .75;

                filter:
                    blur(.5px);
            }

            100% {

                opacity: 1;

                filter:
                    blur(0);
            }
        }


        /* ================================
           LABEL
        ================================= */

        .label {

            font-size:
                clamp(
                    .58rem,
                    2.5vw,
                    .75rem
                );

            text-transform: uppercase;

            letter-spacing:
                clamp(
                    1px,
                    .45vw,
                    2px
                );

            color: #a0aec0;

            white-space: nowrap;
        }


        /* ================================
           PILLARS
        ================================= */

        .pillars {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 0;

            margin-top: 20px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.05);

            padding-top: 30px;

            width: 100%;
        }


        .pillar-item {

            font-size:
                clamp(
                    .62rem,
                    2.8vw,
                    .85rem
                );

            letter-spacing:
                clamp(
                    1px,
                    .4vw,
                    1.5px
                );

            text-transform: uppercase;

            color: #a0aec0;

            display: flex;

            align-items: center;

            gap: 6px;

            white-space: nowrap;

            padding:
                0 12px;

            position: relative;
        }


        /*
           Small separator
        */

        .pillar-item:not(:last-child)::after {

            content: "·";

            position: absolute;

            right: -2px;

            color:
                rgba(255,255,255,.22);
        }


        .pillar-item span {

            color: #e25c72;

            font-size: 1em;
        }


        /* ================================
           MESSAGE
        ================================= */

        #message {

            font-size:
                clamp(
                    1.7rem,
                    7vw,
                    2.2rem
                );

            font-family: Georgia, serif;

            color: #f687b3;

            display: none;

            margin-top: 20px;

            line-height: 1.3;

            text-shadow:
                0 0 15px
                rgba(246, 135, 179, 0.3);
        }


        /* ================================
           SMALL MOBILE
        ================================= */

        @media (max-width: 420px) {

            body {

                padding-left: 12px;
                padding-right: 12px;
            }


            .intent-badge {

                font-size: .67rem;

                letter-spacing:
                    1.5px;

                padding:
                    6px 12px;

                margin-bottom: 20px;
            }


            h1 {

                font-size:
                    clamp(
                        1.7rem,
                        8vw,
                        2rem
                    );

                margin-bottom: 10px;
            }


            .subtitle {

                margin-bottom: 30px;

                font-size: .9rem;
            }


            .countdown-display {

                gap: 7px;

                margin-bottom: 32px;
            }


            .time-box {

                padding:
                    18px 3px;

                border-radius: 13px;
            }


            .number {

                font-size:
                    clamp(
                        1.75rem,
                        9vw,
                        2.25rem
                    );

                min-height: 30px;
            }


            .label {

                font-size: .52rem;

                letter-spacing:
                    .8px;
            }


            .pillars {

                padding-top: 24px;
            }


            .pillar-item {

                padding:
                    0 7px;

                gap: 4px;

                font-size: .58rem;

                letter-spacing:
                    1px;
            }
        }


        /* ================================
           VERY SMALL PHONES
        ================================= */

        @media (max-width: 340px) {

            .countdown-display {

                gap: 5px;
            }


            .time-box {

                padding:
                    16px 2px;
            }


            .number {

                font-size: 1.6rem;
            }


            .label {

                font-size: .47rem;
            }


            .pillar-item {

                padding:
                    0 5px;

                font-size:
                    .52rem;
            }
        }


        /* ================================
           SHORT SCREENS
        ================================= */

        @media (max-height: 680px) {

            .intent-badge {

                margin-bottom: 15px;
            }


            h1 {

                margin-bottom: 8px;
            }


            .subtitle {

                margin-bottom: 24px;
            }


            .countdown-display {

                margin-bottom: 25px;
            }


            .time-box {

                padding:
                    16px 5px;
            }


            .pillars {

                padding-top: 20px;
            }
        }


        /* ================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;
            }
        }

    </style>
</head>


<body>

    <!-- Background Petals -->
    <div id="petal-container"></div>


    <div class="container">

        <!-- Existing wording kept -->
        <div class="intent-badge">
            A Special Awaited Moment
        </div>


        <h1>
            Counting the Moments Until We Meet
        </h1>


        <p class="subtitle">
            Savouring the passing time with shared anticipation.
        </p>


        <!-- Countdown -->
        <div
            class="countdown-display"
            id="countdown-boxes"
        >

            <div class="time-box">

                <div
                    class="number"
                    id="days"
                >
                    00
                </div>

                <div class="label">
                    Days
                </div>

            </div>


            <div class="time-box">

                <div
                    class="number"
                    id="hours"
                >
                    00
                </div>

                <div class="label">
                    Hours
                </div>

            </div>


            <div class="time-box">

                <div
                    class="number"
                    id="minutes"
                >
                    00
                </div>

                <div class="label">
                    Mins
                </div>

            </div>


            <div class="time-box">

                <div
                    class="number"
                    id="seconds"
                >
                    00
                </div>

                <div class="label">
                    Secs
                </div>

            </div>

        </div>


        <!-- Arrival message -->
        <div id="message">
            The beautiful moment has arrived. ✨
        </div>


        <!-- Updated concepts -->
        <div class="pillars">

            <div class="pillar-item">
                <span>♥</span>
                Experiment
            </div>

            <div class="pillar-item">
                <span>✦</span>
                Adventure
            </div>

            <div class="pillar-item">
                <span>👁</span>
                Curiosity
            </div>

        </div>

    </div>


    <script>

        /* ==========================================
           TARGET
        ========================================== */

        const targetDate =
            new Date(
                "September 26, 2026 19:30:00"
            ).getTime();


        /* ==========================================
           PREVIOUS VALUES
        ========================================== */

        let prevTime = {

            days: "",
            hours: "",
            minutes: "",
            seconds: ""

        };


        /* ==========================================
           COUNTDOWN UPDATE
        ========================================== */

        function updateCountdown() {

            const now =
                Date.now();

            const timeDifference =
                targetDate - now;


            /* -------------------------------
               TARGET REACHED
            -------------------------------- */

            if (timeDifference <= 0) {

                clearInterval(
                    countdownInterval
                );


                document
                    .getElementById(
                        "countdown-boxes"
                    )
                    .style.display = "none";


                document
                    .getElementById(
                        "message"
                    )
                    .style.display = "block";


                return;
            }


            /* -------------------------------
               CALCULATE
            -------------------------------- */

            const days =
                String(
                    Math.floor(
                        timeDifference /
                        (1000 * 60 * 60 * 24)
                    )
                ).padStart(2, "0");


            const hours =
                String(
                    Math.floor(
                        (
                            timeDifference %
                            (1000 * 60 * 60 * 24)
                        ) /
                        (1000 * 60 * 60)
                    )
                ).padStart(2, "0");


            const minutes =
                String(
                    Math.floor(
                        (
                            timeDifference %
                            (1000 * 60 * 60)
                        ) /
                        (1000 * 60)
                    )
                ).padStart(2, "0");


            const seconds =
                String(
                    Math.floor(
                        (
                            timeDifference %
                            (1000 * 60)
                        ) /
                        1000
                    )
                ).padStart(2, "0");


            /* -------------------------------
               RENDER
            -------------------------------- */

            renderUnit(
                "days",
                days
            );

            renderUnit(
                "hours",
                hours
            );

            renderUnit(
                "minutes",
                minutes
            );

            renderUnit(
                "seconds",
                seconds
            );
        }


        /* ==========================================
           RENDER SINGLE NUMBER
        ========================================== */

        function renderUnit(
            id,
            value
        ) {

            const element =
                document.getElementById(id);


            /*
               Nothing changes if value
               is still the same.
            */

            if (
                prevTime[id] === value
            ) {
                return;
            }


            /*
               Update only the number.
               The card itself never moves.
            */

            element.textContent =
                value;


            /*
               Restart only the text
               opacity animation.
            */

            element.classList.remove(
                "animate-tick"
            );


            void element.offsetWidth;


            element.classList.add(
                "animate-tick"
            );


            prevTime[id] =
                value;
        }


        /* ==========================================
           CREATE PETALS
        ========================================== */

        function createPetals() {

            const container =
                document.getElementById(
                    "petal-container"
                );


            /*
               Fewer particles on mobile
               for better performance.
            */

            const amount =
                window.innerWidth <= 500
                    ? 5
                    : 8;


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const petal =
                    document.createElement(
                        "div"
                    );


                petal.classList.add(
                    "petal"
                );


                const size =
                    Math.random() *
                    12 +
                    10;


                petal.style.left =
                    Math.random() *
                    100 +
                    "vw";


                petal.style.width =
                    size +
                    "px";


                petal.style.height =
                    size +
                    "px";


                petal.style.animationDelay =
                    Math.random() *
                    10 +
                    "s";


                petal.style.animationDuration =
                    Math.random() *
                    6 +
                    10 +
                    "s";


                container.appendChild(
                    petal
                );
            }
        }


        /* ==========================================
           START
        ========================================== */

        createPetals();

        updateCountdown();


        const countdownInterval =
            setInterval(
                updateCountdown,
                1000
            );

    </script>

</body>
</html>
