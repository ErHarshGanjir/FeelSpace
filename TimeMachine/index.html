<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Temporal Gateway</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --cyan: #00f3ff;
            --purple: #bc13fe;
            --bg-dark: #070714;
            --glass: rgba(16, 16, 36, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* Modern Background Animations */
        .bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 10s infinite linear;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* Glassmorphism UI Panel */
        .ui-panel {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
            max-width: 90%;
            width: 450px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan);
            margin-bottom: 10px;
            text-align: center;
        }

        .status {
            font-size: 1.2rem;
            color: #aaa;
            text-align: center;
            height: 40px;
            margin-bottom: 30px;
        }

        .highlight {
            color: var(--purple);
            font-weight: bold;
            text-shadow: 0 0 8px var(--purple);
        }

        /* Modern SVG Scanner */
        .scanner-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* Progress Circle */
        .progress-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .progress-bar {
            fill: none;
            stroke: var(--cyan);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 722; /* 2 * PI * 115(r) */
            stroke-dashoffset: 722;
            transition: stroke-dashoffset 0.1s linear, stroke 0.5s;
            filter: drop-shadow(0 0 8px var(--cyan));
        }

        /* The Fingerprint Area */
        .finger-zone {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, transparent 70%);
            border: 2px dashed rgba(0, 243, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: rgba(0, 243, 255, 0.5);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* Active Traveling State */
        body.traveling .finger-zone {
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 30px rgba(0, 243, 255, 0.4);
            transform: scale(0.95);
        }

        body.traveling .ui-panel {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(188, 19, 254, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
        }

        body.traveling .progress-bar {
            stroke: var(--purple);
            filter: drop-shadow(0 0 15px var(--purple));
        }

        /* Scanning Line */
        .scan-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: #fff;
            box-shadow: 0 0 15px 5px var(--purple);
            opacity: 0;
        }

        body.traveling .scan-line {
            opacity: 1;
            animation: scanLine 1.5s infinite linear;
        }

        @keyframes scanLine {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Modern Orbital Rings during travel */
        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--cyan);
            border-bottom-color: var(--purple);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .orbit-1 { width: 350px; height: 350px; animation: spinLeft 4s infinite linear; }
        .orbit-2 { width: 450px; height: 450px; animation: spinRight 6s infinite linear; border-top-color: var(--purple); border-bottom-color: var(--cyan); }
        
        body.traveling .orbit { opacity: 0.5; }

        @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
        @keyframes spinRight { 100% { transform: rotate(360deg); } }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 7, 20, 0.9);
            backdrop-filter: blur(20px);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 0 15px var(--cyan);
        }

        .modal p {
            font-size: 1.5rem;
            max-width: 600px;
            line-height: 1.6;
            color: #ddd;
        }

        .modal p span.system-ok { color: #00ff66; font-weight: bold; text-shadow: 0 0 8px #00ff66;}
        .modal p span.user-error { color: #ff3366; font-weight: bold; text-shadow: 0 0 8px #ff3366;}

        .btn {
            margin-top: 40px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid var(--cyan);
            border-radius: 8px;
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn:hover {
            background: var(--cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 30px var(--cyan);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>

    <div class="ui-panel">
        <h1>Quantum Gateway</h1>
        <div class="status" id="status-text">
            Awaiting biometric sequence...<br>
            <span class="highlight">Hold fingerprint firmly to initiate.</span>
        </div>

        <div class="scanner-wrapper" id="scanner">
            <svg class="progress-svg" viewBox="0 0 250 250">
                <circle class="progress-bg" cx="125" cy="125" r="115"></circle>
                <circle class="progress-bar" id="progress-circle" cx="125" cy="125" r="115"></circle>
            </svg>
            
            <div class="finger-zone">
                <div class="scan-line"></div>
                <span id="percentage-text">0%</span>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="modal" id="result-modal">
        <h2 id="result-title">PROCESS TERMINATED</h2>
        <p id="result-message"></p>
        <button class="btn" onclick="resetMachine()">Acknowledge & Restart</button>
    </div>

    <script>
        const scanner = document.getElementById('scanner');
        const statusText = document.getElementById('status-text');
        const progressCircle = document.getElementById('progress-circle');
        const percentageText = document.getElementById('percentage-text');
        const resultModal = document.getElementById('result-modal');
        const resultMessage = document.getElementById('result-message');
        const resultTitle = document.getElementById('result-title');

        let holdTimer;
        let progressInterval;
        let progress = 0;
        const requiredTime = 15000; // 15 seconds
        const maxDashOffset = 722; // Circumference of the SVG circle

        // The funny responses: System works perfectly, user is the problem.
        const outcomes = [
            {
                title: "TIME TRAVEL DENIED",
                message: "<span class='system-ok'>System Status: 100% Perfect. Working Flawlessly.</span><br><br><span class='user-error'>Error Code 401: Germs Detected.</span><br>We do not allow temporal transit for users with unwashed hands. We cannot risk introducing your specific bacteria to the Cretaceous period. Go wash your hands and try again."
            },
            {
                title: "PROCESS ABORTED",
                message: "<span class='system-ok'>Quantum Engine: Operational. Trajectory: Locked.</span><br><br><span class='user-error'>Error Code 88: Trash Mobile Device.</span><br>Our multimillion-dollar system works perfectly, but your phone's processor is too weak to render the 4th dimension. Please upgrade your device to time travel."
            },
            {
                title: "ACCESS RESTRICTED",
                message: "<span class='system-ok'>Chroniton Emitters: Perfect. Server Status: Flawless.</span><br><br><span class='user-error'>Error Code 109: Smudged Screen.</span><br>The gateway collapsed because your screen is filthy. Your greasy fingerprints deflected the temporal lasers. Clean your display, human."
            },
            {
                title: "TIMELINE REJECTED YOU",
                message: "<span class='system-ok'>System Diagnostics: Exceptional. Phenomenal, even.</span><br><br><span class='user-error'>Error Code 404: Lack of Vibes.</span><br>The future scanned your personality profile and decided you aren't cool enough for 2099. The past also politely declined your visit. System is fine; you are just boring."
            },
            {
                title: "CRITICAL ALERT",
                message: "<span class='system-ok'>System Core: Stable and Perfect.</span><br><br><span class='user-error'>Error Code 999: Multiverse Fracture.</span><br>Because you hesitated slightly, the space-time continuum split. You are now in a completely different universe. Everything looks exactly the same, but for your safety, do not let anyone know you are from a different reality. Act normal."
            },
            {
                title: "CONNECTION FAILED",
                message: "<span class='system-ok'>Temporal Servers: Lightning Fast.</span><br><br><span class='user-error'>Error Code 001: Sweaty Palms.</span><br>Our advanced biometric scanners cannot authenticate you because your hands are sweating profusely. Are you nervous about altering history? Calm down and dry your hands."
            }
        ];

        function startTimeTravel(e) {
            e.preventDefault(); 
            
            progress = 0;
            document.body.classList.add('traveling');
            statusText.innerHTML = "Initializing Quantum Tunnel...<br><span style='color: var(--cyan);'>MAINTAIN BIOMETRIC CONTACT.</span>";

            progressInterval = setInterval(() => {
                progress += (100 / (requiredTime / 50)); 
                if(progress >= 100) progress = 100;
                
                // Update text
                percentageText.innerText = Math.floor(progress) + "%";
                
                // Update SVG Circle (Dash offset goes from 722 down to 0)
                const offset = maxDashOffset - (progress / 100) * maxDashOffset;
                progressCircle.style.strokeDashoffset = offset;

            }, 50);

            holdTimer = setTimeout(() => {
                completeTimeTravel();
            }, requiredTime);
        }

        function cancelTimeTravel() {
            if (progress >= 100) return; 

            clearTimeout(holdTimer);
            clearInterval(progressInterval);
            
            if (progress > 0 && progress < 100) {
                statusText.innerHTML = "<span style='color: #ff3366;'>BIOMETRIC LOCK LOST.</span><br>You let go. Try again without shaking.";
            } else {
                statusText.innerHTML = "Awaiting biometric sequence...<br><span class='highlight'>Hold fingerprint firmly to initiate.</span>";
            }

            // Reset visual states smoothly
            progress = 0;
            percentageText.innerText = "0%";
            progressCircle.style.strokeDashoffset = maxDashOffset;
            document.body.classList.remove('traveling');
        }

        function completeTimeTravel() {
            clearTimeout(holdTimer);
            clearInterval(progressInterval);
            document.body.classList.remove('traveling');
            
            const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
            
            if(randomOutcome.title === "CRITICAL ALERT") {
                resultTitle.style.color = "#ff3366";
                resultTitle.style.textShadow = "0 0 15px #ff3366";
            } else {
                resultTitle.style.color = "#00f3ff";
                resultTitle.style.textShadow = "0 0 15px #00f3ff";
            }

            resultTitle.innerText = randomOutcome.title;
            resultMessage.innerHTML = randomOutcome.message;
            
            resultModal.style.display = "flex";
        }

        function resetMachine() {
            resultModal.style.display = "none";
            progress = 0;
            percentageText.innerText = "0%";
            progressCircle.style.strokeDashoffset = maxDashOffset;
            statusText.innerHTML = "Awaiting biometric sequence...<br><span class='highlight'>Hold fingerprint firmly to initiate.</span>";
        }

        // Mouse Events
        scanner.addEventListener('mousedown', startTimeTravel);
        window.addEventListener('mouseup', cancelTimeTravel);

        // Touch Events
        scanner.addEventListener('touchstart', startTimeTravel, {passive: false});
        window.addEventListener('touchend', cancelTimeTravel);
        window.addEventListener('touchcancel', cancelTimeTravel);

    </script>
</body>
</html>
