<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIME MACHINE // CHRONO-SCANNER v9.4</title>
  <style>
    :root {
      --primary: #00ffcc;
      --secondary: #ff00ff;
      --danger: #ff3333;
      --bg: #050811;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: 'Courier New', Courier, monospace;
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.8s ease;
    }

    /* Animated Grid Background */
    .grid-bg {
      position: absolute;
      width: 200vw;
      height: 200vh;
      background-image: 
        linear-gradient(rgba(0, 255, 204, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 10s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }

    .container {
      text-align: center;
      z-index: 10;
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--primary);
      margin-bottom: 5px;
    }

    .status-box {
      min-height: 60px;
      margin: 20px 0;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 8px var(--secondary);
    }

    /* Fingerprint Scanner Button */
    .scanner-outer {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 30px auto;
      border: 3px dashed var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
      transition: all 0.3s ease;
    }

    .scanner-outer:active {
      transform: scale(0.95);
    }

    .fingerprint-icon {
      font-size: 80px;
      filter: drop-shadow(0 0 10px var(--primary));
      transition: transform 0.2s;
    }

    /* Laser Scan Line */
    .laser {
      position: absolute;
      width: 100%;
      height: 4px;
      background: var(--secondary);
      box-shadow: 0 0 15px var(--secondary);
      top: 0;
      left: 0;
      display: none;
      animation: scanLaser 1.2s ease-in-out infinite alternate;
    }

    @keyframes scanLaser {
      0% { top: 10%; opacity: 0.8; }
      100% { top: 90%; opacity: 1; }
    }

    /* Progress Ring */
    .progress-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 240px;
      height: 240px;
      transform: rotate(-90deg);
    }

    .progress-ring circle {
      fill: transparent;
      stroke: var(--secondary);
      stroke-width: 8;
      stroke-dasharray: 700;
      stroke-dashoffset: 700;
      transition: stroke-dashoffset 0.2s linear;
    }

    /* Warp Speed Visual Effects */
    .warp-active {
      animation: warpShake 0.1s infinite;
    }

    @keyframes warpShake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      50% { transform: translate(-1px, -2px) rotate(-1deg); }
      100% { transform: translate(-2px, 0px) rotate(1deg); }
    }

    /* Result Modal */
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 15, 30, 0.95);
      border: 2px solid var(--primary);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 50px var(--primary);
      max-width: 500px;
      width: 90%;
      z-index: 100;
      text-align: center;
    }

    .modal h2 {
      color: var(--secondary);
      margin-top: 0;
    }

    .modal p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #fff;
    }

    .btn-reset {
      margin-top: 20px;
      padding: 12px 25px;
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary);
    }

    .btn-reset:hover {
      background: var(--primary);
      color: #000;
    }

    .danger-mode {
      border-color: var(--danger) !important;
      box-shadow: 0 0 50px var(--danger) !important;
    }

    .danger-mode h2 {
      color: var(--danger) !important;
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>

  <div class="container" id="main-container">
    <h1>CHRONO-PORTAL v9.4</h1>
    <p>HOLD FINGERPRINT FOR 15 SECONDS TO INITIATE TIME TRAVEL</p>

    <div class="status-box" id="status-text">
      SYSTEM READY: PLACE AND HOLD FINGERPRINT
    </div>

    <div class="scanner-outer" id="scanner">
      <svg class="progress-ring">
        <circle id="progress-circle" cx="120" cy="120" r="110"></circle>
      </svg>
      <div class="laser" id="laser"></div>
      <div class="fingerprint-icon">👆</div>
    </div>
  </div>

  <!-- Outcome Modal -->
  <div class="modal" id="result-modal">
    <h2 id="modal-title">TIME TRAVEL COMPLETE</h2>
    <p id="modal-desc">You have arrived in your destination timeline.</p>
    <button class="btn-reset" onclick="resetSystem()">TRAVEL AGAIN</button>
  </div>

  <script>
    const scanner = document.getElementById('scanner');
    const statusText = document.getElementById('status-text');
    const laser = document.getElementById('laser');
    const progressCircle = document.getElementById('progress-circle');
    const modal = document.getElementById('result-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const mainContainer = document.getElementById('main-container');

    const REQUIRED_TIME = 15000; // 15 Seconds
    let pressTimer = null;
    let startTime = 0;
    let isScanning = false;

    // Quirky messages shown during the 15-second hold
    const progressMessages = [
      { time: 1000, text: "SCANNING BIOMETRICS... WARMING UP FLUX CAPACITOR" },
      { time: 3000, text: "⚠️ WARNING: WASH YOUR HANDS FIRST! DETECTING SNACK RESIDUE..." },
      { time: 6000, text: "CALIBRATING QUANTUM COORDINATES... HOLD STEADY!" },
      { time: 9000, text: "RIPPING FABRIC OF SPACE-TIME... DO NOT LET GO!" },
      { time: 12000, text: "ALMOST THERE! DIVERGING UNIVERSAL TIMELINE..." },
      { time: 14000, text: "HYPER-JUMP IMMINENT! BRACE FOR IMPACT!" }
    ];

    // Funny Destination Outcomes
    const funnyOutcomes = [
      "You traveled 10 minutes into the future! Unfortunately, your coffee is now lukewarm.",
      "You arrived in 65,000,000 BCE. A T-Rex is currently judging your outfit.",
      "You traveled to the year 3024. Good news: Time machines are cheap. Bad news: Toilets require calculus to operate.",
      "You successfully traveled to yesterday! You still forgot where you left your keys.",
      "Time Jump Complete: You are now 5 seconds younger, but you owe the Space-Time IRS $40,000 in causality taxes.",
      "You arrived in medieval Europe! They immediately declared your smartphone a witch.",
      "You jumped to 1999! Please warn everyone that Y2K is just a lot of paperwork.",
      "You traveled to an era where dogs rule the planet. Sit. Stay. Good human.",
      "You arrived in the year 2050. Flying cars exist, but traffic is still terrible in 3D."
    ];

    // The iconic multiverse safety warning
    const dangerOutcome = {
      title: "⚠️ DANGER: TIME-SPACE CRASHED ⚠️",
      text: "CRITICAL ALERT: Your time-space continuum has collapsed! You have been dumped into a DIFFERENT UNIVERSE.<br><br>Everything here looks 100% IDENTICAL to your original universe. Make sure NO ONE determines you are from a different universe. This protocol is strictly for your own safety! Act normal."
    };

    function startScan(e) {
      e.preventDefault();
      if (isScanning) return;
      isScanning = true;
      startTime = Date.now();
      laser.style.display = 'block';
      statusText.style.color = '#00ffcc';

      pressTimer = setInterval(updateProgress, 50);
    }

    function stopScan(e) {
      e.preventDefault();
      if (!isScanning) return;
      isScanning = false;
      clearInterval(pressTimer);
      laser.style.display = 'none';
      progressCircle.style.strokeDashoffset = 700;
      document.body.style.backgroundColor = '#050811';
      mainContainer.classList.remove('warp-active');

      statusText.innerHTML = "⚠️ JUMP ABORTED! You released your finger too early!";
      statusText.style.color = '#ff3333';
    }

    function updateProgress() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / REQUIRED_TIME, 1);

      // Circle dash animation (700 is full offset)
      const offset = 700 - (progress * 700);
      progressCircle.style.strokeDashoffset = offset;

      // Dynamic color & background shifts during hold
      if (progress > 0.3 && progress <= 0.6) {
        document.body.style.backgroundColor = '#1a002c'; // Purple shift
      } else if (progress > 0.6 && progress <= 0.85) {
        document.body.style.backgroundColor = '#2c0000'; // Red danger shift
      } else if (progress > 0.85) {
        document.body.style.backgroundColor = '#001a14'; // Hyper green shift
        mainContainer.classList.add('warp-active');
      }

      // Display humorous messages at time thresholds
      for (let msg of progressMessages) {
        if (elapsed >= msg.time && elapsed < msg.time + 1500) {
          statusText.innerHTML = msg.text;
        }
      }

      // Check if 15 seconds are completed
      if (elapsed >= REQUIRED_TIME) {
        clearInterval(pressTimer);
        isScanning = false;
        laser.style.display = 'none';
        mainContainer.classList.remove('warp-active');
        triggerOutcome();
      }
    }

    function triggerOutcome() {
      modal.classList.remove('danger-mode');

      // 25% chance to trigger the Dangerous Multiverse Warning
      const isDanger = Math.random() < 0.25;

      if (isDanger) {
        modal.classList.add('danger-mode');
        modalTitle.innerHTML = dangerOutcome.title;
        modalDesc.innerHTML = dangerOutcome.text;
      } else {
        const randomIndex = Math.floor(Math.random() * funnyOutcomes.length);
        modalTitle.innerHTML = "✨ TIME TRAVEL COMPLETE ✨";
        modalDesc.innerHTML = funnyOutcomes[randomIndex];
      }

      modal.style.display = 'block';
    }

    function resetSystem() {
      modal.style.display = 'none';
      progressCircle.style.strokeDashoffset = 700;
      document.body.style.backgroundColor = '#050811';
      statusText.innerHTML = "SYSTEM READY: PLACE AND HOLD FINGERPRINT";
      statusText.style.color = '#00ffcc';
    }

    // Touch and Mouse Event Listeners
    scanner.addEventListener('mousedown', startScan);
    window.addEventListener('mouseup', stopScan);
    scanner.addEventListener('touchstart', startScan);
    window.addEventListener('touchend', stopScan);
  </script>
</body>
</html>
