<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Machine Terminal</title>
    <style>
        :root {
            --cyan: #0ff;
            --red: #ff3333;
            --bg: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: var(--cyan);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.5s;
        }

        /* Hyperspace Stars Background */
        .stars {
            position: absolute;
            top: 50%; left: 50%;
            width: 200vw; height: 200vh;
            background: repeating-radial-gradient(
                circle at center, 
                transparent 0, 
                transparent 15px, 
                rgba(0, 255, 255, 0.15) 16px, 
                rgba(0, 255, 255, 0.15) 20px
            );
            transform: translate(-50%, -50%);
            opacity: 0.1;
            z-index: 1;
            pointer-events: none;
            transition: opacity 1s, transform 1s;
        }

        /* The Main Terminal Structure */
        .terminal-box {
            position: relative;
            z-index: 10;
            border: 2px solid var(--cyan);
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.1);
            border-radius: 10px;
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--cyan);
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--cyan);
            padding-bottom: 10px;
        }

        .status {
            font-size: 1.1rem;
            margin-bottom: 30px;
            height: 3rem;
            line-height: 1.5;
        }

        .warning {
            color: var(--red);
            text-shadow: 0 0 10px var(--red);
            font-weight: bold;
            animation: blink 1s infinite;
        }

        /* Structured Progress Bar */
        .progress-container {
            width: 100%;
            height: 25px;
            border: 2px solid var(--cyan);
            margin-bottom: 30px;
            position: relative;
            background: #000;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--cyan);
            box-shadow: 0 0 15px var(--cyan);
            transition: width 0.1s linear;
        }

        .progress-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            mix-blend-mode: difference;
        }

        /* Classic Pill Scanner */
        .scanner-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .fingerprint {
            width: 120px;
            height: 160px;
            border: 4px solid var(--cyan);
            border-radius: 50px 50px 40px 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 10px,
                rgba(0, 255, 255, 0.1) 10px,
                rgba(0, 255, 255, 0.1) 11px
            );
        }

        /* Scanning laser */
        .laser {
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 5px;
            background: #fff;
            box-shadow: 0 0 15px 5px var(--cyan);
            opacity: 0;
        }

        /* Active State Animations (When Holding) */
        body.traveling {
            animation: timeWarpColors 1.5s infinite, shake 0.4s infinite;
        }

        body.traveling .stars {
            opacity: 1;
            animation: spin 3s infinite linear;
        }

        body.traveling .fingerprint {
            box-shadow: 0 0 50px var(--cyan), inset 0 0 50px var(--cyan);
            transform: scale(0.95);
            background: rgba(0, 255, 255, 0.2);
        }

        body.traveling .laser {
            opacity: 1;
            animation: scan 1.5s infinite linear;
        }

        /* Results Screen (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .modal h2 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--cyan);
            padding-bottom: 10px;
        }

        .modal p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.8;
            color: var(--cyan);
        }

        .system-ok { color: #00ff66; text-shadow: 0 0 5px #00ff66; }
        .user-error { color: var(--red); text-shadow: 0 0 5px var(--red); }

        .restart-btn {
            margin-top: 40px;
            padding: 15px 30px;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .restart-btn:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 20px var(--cyan);
        }

        /* Keyframes */
        @keyframes scan {
            0% { top: -10px; }
            50% { top: 100%; }
            100% { top: -10px; }
        }

        @keyframes spin {
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1.5); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes timeWarpColors {
            0% { background-color: #050505; }
            25% { background-color: #001a1a; }
            50% { background-color: #1a001a; }
            75% { background-color: #00001a; }
            100% { background-color: #050505; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="terminal-box">
        <h1>Time Machine</h1>
        
        <div class="status" id="status-text">
            SYSTEM READY.<br>
            Hold thumb on scanner to initiate sequence.
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>

        <div class="scanner-container">
            <div class="fingerprint" id="scanner">
                <div class="laser"></div>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="modal" id="result-modal">
        <h2 id="result-title">PROCESS TERMINATED</h2>
        <p id="result-message"></p>
        <button class="restart-btn" onclick="resetMachine()">REBOOT SYSTEM</button>
    </div>

    <script>
        const scanner = document.getElementById('scanner');
        const statusText = document.getElementById('status-text');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const resultModal = document.getElementById('result-modal');
        const resultMessage = document.getElementById('result-message');
        const resultTitle = document.getElementById('result-title');

        let holdTimer;
        let progressInterval;
        let progress = 0;
        const requiredTime = 15000; // 15 seconds

        // Funny responses: System perfect, user/germs are the problem
        const outcomes = [
            {
                title: "TIME TRAVEL DENIED",
                message: "<span class='system-ok'>[SYSTEM STATUS: 100% FLAWLESS]</span><br><br><span class='user-error'>[ERROR 401: GERMS DETECTED]</span><br><br>We do not allow temporal transit for users with unwashed hands. We cannot risk introducing your specific hand-bacteria to the Jurassic period. Go wash your hands with soap and try again."
            },
            {
                title: "PROCESS ABORTED",
                message: "<span class='system-ok'>[QUANTUM ENGINE: OPERATIONAL]</span><br><br><span class='user-error'>[ERROR 88: TRASH DEVICE]</span><br><br>Our multimillion-dollar time machine works perfectly, but your phone's screen is too dirty to process the 4th dimension. Please wipe your screen on your shirt to time travel."
            },
            {
                title: "CRITICAL ALERT",
                message: "<span class='system-ok'>[SERVER STATUS: PERFECT]</span><br><br><span class='user-error'>[ERROR 999: MULTIVERSE FRACTURE]</span><br><br>Because your finger twitched slightly, the space-time continuum split. You are now in a completely different universe. Everything looks EXACTLY the same, but for your safety, do not tell anyone you are from a different reality. Act normal."
            },
            {
                title: "CONNECTION FAILED",
                message: "<span class='system-ok'>[TEMPORAL LASERS: CALIBRATED]</span><br><br><span class='user-error'>[ERROR 001: SWEATY PALMS]</span><br><br>Our highly advanced scanners cannot authenticate you because your hands are sweating profusely. Are you nervous about altering history? Calm down, dry your hands, and reboot."
            },
            {
                title: "TIMELINE REJECTED YOU",
                message: "<span class='system-ok'>[SYSTEM DIAGNOSTICS: EXCEPTIONAL]</span><br><br><span class='user-error'>[ERROR 404: VIBE CHECK FAILED]</span><br><br>The future scanned your personality profile and decided you aren't cool enough for 2099. The past also politely declined your visit. The machine is fine; you are just boring."
            }
        ];

        function startTimeTravel(e) {
            e.preventDefault(); 
            
            progress = 0;
            document.body.classList.add('traveling');
            statusText.innerHTML = "WARPING SPACE-TIME...<br><span class='warning'>DO NOT REMOVE FINGER!</span>";

            progressInterval = setInterval(() => {
                progress += (100 / (requiredTime / 50)); 
                if(progress >= 100) progress = 100;
                
                // Update text and width
                progressText.innerText = Math.floor(progress) + "%";
                progressFill.style.width = progress + "%";

            }, 50);

            holdTimer = setTimeout(() => {
                completeTimeTravel();
            }, requiredTime);
        }

        function cancelTimeTravel() {
            if (progress >= 100) return; 

            clearTimeout(holdTimer);
            clearInterval(progressInterval);
            
            if (progress > 0 && progress < 100) {
                statusText.innerHTML = "<span class='warning'>BIOMETRIC LOCK LOST!</span><br>You let go too early. Wash hands and try again.";
            } else {
                statusText.innerHTML = "SYSTEM READY.<br>Hold thumb on scanner to initiate sequence.";
            }

            // Reset visual states smoothly
            progress = 0;
            progressText.innerText = "0%";
            progressFill.style.width = "0%";
            document.body.classList.remove('traveling');
        }

        function completeTimeTravel() {
            clearTimeout(holdTimer);
            clearInterval(progressInterval);
            document.body.classList.remove('traveling');
            
            const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
            
            if(randomOutcome.title === "CRITICAL ALERT") {
                resultTitle.style.color = "#ff3333";
                resultTitle.style.textShadow = "0 0 15px #ff3333";
            } else {
                resultTitle.style.color = "#0ff";
                resultTitle.style.textShadow = "0 0 15px #0ff";
            }

            resultTitle.innerText = randomOutcome.title;
            resultMessage.innerHTML = randomOutcome.message;
            
            resultModal.style.display = "flex";
        }

        function resetMachine() {
            resultModal.style.display = "none";
            progress = 0;
            progressText.innerText = "0%";
            progressFill.style.width = "0%";
            statusText.innerHTML = "SYSTEM READY.<br>Hold thumb on scanner to initiate sequence.";
        }

        // Mouse Events
        scanner.addEventListener('mousedown', startTimeTravel);
        window.addEventListener('mouseup', cancelTimeTravel);

        // Touch Events
        scanner.addEventListener('touchstart', startTimeTravel, {passive: false});
        window.addEventListener('touchend', cancelTimeTravel);
        window.addEventListener('touchcancel', cancelTimeTravel);

    </script>
</body>
</html>
